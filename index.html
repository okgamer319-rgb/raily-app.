<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raily AI Assistant</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        h1 {
            color: #3b82f6;
            margin-bottom: 10px;
        }
        p {
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Raily AI Assistant</h1>
        <p>अपने पर्सनल एआई असिस्टेंट से बात करने के लिए ऐप</p>
    </div>

    <!-- Vapi AI Embed Script -->
    <script>
      var vapiInstance = null;
      const assistantId = "51cefda8-3673-4f6d-9696-e07c1392acb9";
      const apiKey = "4ae16b0e-df04-4b49-b32f-3eaa4eb556ee";
      
      // Vapi Loader Script
      (function (d, t) {
        var g = d.createElement(t),
            s = d.getElementsByTagName(t)[0];
        g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        g.defer = true;
        g.async = true;
        s.parentNode.insertBefore(g, s);

        g.onload = function () {
          window.vapiSDK.run({
            apiKey: apiKey,
            assistant: assistantId,
            config: {
              position: "bottom-right",
              offset: "40px",
              width: "50px",
              height: "50px",
              idle: {
                color: "rgb(59, 130, 246)",
                type: "pill",
                title: "Raily AI से बात करें",
                subtitle: "टैप करें",
                icon: "https://unpkg.com/lucide-static@latest/icons/mic.svg"
              }
            }
          });
        };
      })(document, "script");
    </script>
</body>
</html>
